syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.penguin.api";
option java_outer_classname = "PortfolioProto";

service Portfolio {
  rpc GetPortfolios (PortfolioRequest) returns (PortfolioResponse) {}
}

message PortfolioRequest {
  int32 count = 1;
}

message PortfolioContent {
  string id = 1;
  string title = 2;
  string description = 3;
  string author = 4;
  string skills = 5;
  string job = 6;
  string link = 7;
  string thumbnail = 8;
  int64 thumbs = 9;
  int64 views = 10;
}

message PortfolioResponse {
  repeated PortfolioContent portfolios = 1;
}
